<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lili Valencia · Ventas</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --bg:#0d0d14;--surface:#13131e;--surface2:#1a1a28;
  --text:#e8e8f0;--accent:#7c6af7;--accent3:#a89bf9;--accent7:#4b3dc4;
  --n2:#d0d0e0;--n3:#9090a8;--n4:#686880;--n5:#505068;--n7:#2a2a40;--n8:#1e1e30;
  --font:'Inter',system-ui,sans-serif;
  --s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;
  --r:6px;--rm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--accent3)}a:hover{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--n7);border-radius:var(--r)}
.card{background:var(--surface);border-radius:var(--rm);padding:var(--s4)}
.esm{box-shadow:0 1px 3px rgba(0,0,0,.4)}.emd{box-shadow:0 4px 12px rgba(0,0,0,.5)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--n3);margin-bottom:4px}
.ktitle{font-weight:600}.kmeta{font-size:12px;color:var(--n3);margin-top:4px}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--n8);align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-family:var(--font);transition:background .15s}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent7)}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--n7)}.btn-s:hover{background:var(--n8)}
.btn-g{background:transparent;color:var(--n3)}.btn-g:hover{background:var(--surface2);color:var(--text)}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--n7);background:transparent;color:var(--n3);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent3);color:var(--text)}
.chip.on{background:rgba(124,106,247,.15);border-color:var(--accent3);color:var(--accent3)}
.inp{background:var(--n8);border:1px solid var(--n7);border-radius:var(--r);padding:7px 10px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.inp:focus{border-color:var(--accent)}
input[type="date"].inp::-webkit-calendar-picker-indicator{filter:invert(.6)}
.table{border-collapse:collapse;width:100%}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--n4);padding:8px 12px;border-bottom:1px solid var(--n8)}
.table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--n8);color:var(--text)}
.table tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-a{background:rgba(124,106,247,.2);color:var(--accent3)}.tag-n{background:var(--n8);color:var(--n3)}
.bt{background:var(--n8);border-radius:var(--r);overflow:hidden}
.bf{background:linear-gradient(90deg,var(--accent7),var(--accent));border-radius:var(--r)}
.sx{overflow-x:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SHEET_ID='1DQO1nI8ucA8eiEGPKtxCk0PfTBJC3PMWWC8Zu5AWqqk';
const SHEET_TAB='BASE_VENTAS';
const SHEET_MKTG='MARKETING_DIARIO';
const LS_ROWS='lv_dashboard_rows_v1';
const LS_DAILY='lv_dashboard_daily_v1';
const LS_ADS='lv_dashboard_ads_v1';
const LS_META='lv_dashboard_meta_v1';

// ─── Utils ────────────────────────────────────────────────────────────────────
const pm=s=>{if(!s)return 0;const c=String(s).replace(/[^0-9]/g,'');return c?parseInt(c,10):0;};
const fm=n=>'$'+new Intl.NumberFormat('es-CO').format(Math.round(n||0));
const fd=iso=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});};
const dk=d=>d.toISOString().slice(0,10);
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const sow=d=>{const r=new Date(d);return addD(r,-((r.getDay()+6)%7));};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const isoOf=d=>dk(d);

function parseCsv(text){
  const rows=[];let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(field);field='';}
      else if(c==='\r'){}else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}else field+=c;}
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(v=>v!==''));
}
function toISO(row){
  const t=(row[25]||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const c=(row[0]||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(c))return c;
  const m=c.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return null;
}
function parseOrders(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||r.length<5)continue;
    const iso=toISO(r);if(!iso)continue;
    out.push({fecha:iso,cliente:(r[1]||'').trim(),ciudad:(r[2]||'').trim(),
      metodoPago:(r[7]||'Otro').trim()||'Otro',canal:(r[8]||'Otro').trim()||'Otro',
      tipo:(r[9]||'Otro').trim()||'Otro',referencia:(r[11]||'').trim()||'—',
      estado:(r[17]||'').trim()||'Sin estado',asesor:(r[18]||'').trim()||'Sin asesor',
      total:pm(r[6]),valida:(r[22]||'').trim()==='1'});}
  return out;
}
function parseDaily(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[0])continue;
    const f=(r[0]||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(f))continue;
    const v=pm(r[6]);
    out.push({fecha:f,val:v,ventas:parseInt(r[3])||0,contactos:parseInt(r[1])||0});}
  return out;
}

// ─── Shortcuts ────────────────────────────────────────────────────────────────
function shortcuts(){
  const t=today();
  const fmt=d=>isoOf(d);
  return[
    {label:'Hoy',       from:fmt(t),             to:fmt(t)},
    {label:'Ayer',      from:fmt(addD(t,-1)),     to:fmt(addD(t,-1))},
    {label:'Esta sem.', from:fmt(sow(t)),          to:fmt(t)},
    {label:'7 días',    from:fmt(addD(t,-6)),      to:fmt(t)},
    {label:'15 días',   from:fmt(addD(t,-14)),     to:fmt(t)},
    {label:'Este mes',  from:isoOf(new Date(t.getFullYear(),t.getMonth(),1)), to:fmt(t)},
    {label:'30 días',   from:fmt(addD(t,-29)),     to:fmt(t)},
    {label:'Mes ant.',  from:isoOf(new Date(t.getFullYear(),t.getMonth()-1,1)),
                        to:isoOf(new Date(t.getFullYear(),t.getMonth(),0))},
    {label:'Este año',  from:isoOf(new Date(t.getFullYear(),0,1)), to:fmt(t)},
  ];
}

// ─── State ────────────────────────────────────────────────────────────────────
const _t=today();
let S={
  orders:[],daily:[],
  loading:true,error:false,lastUpdated:null,
  from:isoOf(new Date(_t.getFullYear(),_t.getMonth(),1)),
  to:isoOf(_t),
  activeShortcut:'Este mes',
  search:'',showImport:false,importText:'',
  adsByMonth:{},adsDraft:'',visibleCount:12
};

function set(patch){const n=typeof patch==='function'?patch(S):patch;S={...S,...n};render();}

// ─── Fetch ────────────────────────────────────────────────────────────────────
async function fetchTab(tab,parser){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
  try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)return null;
    const t=await r.text();if(!t||t.trim().length<20)return null;
    const rows=parser(parseCsv(t));return rows.length?rows:null;}
  catch(e){return null;}
}
async function fetchLive(){
  set({loading:true});
  const[daily,orders]=await Promise.all([fetchTab(SHEET_MKTG,parseDaily),fetchTab(SHEET_TAB,parseOrders)]);
  const now=new Date().toISOString();
  const u={loading:false,lastUpdated:now};
  if(daily){u.daily=daily;u.error=false;try{localStorage.setItem(LS_DAILY,JSON.stringify(daily));}catch(e){}}
  if(orders){u.orders=orders;try{localStorage.setItem(LS_ROWS,JSON.stringify(orders));}catch(e){}}
  if(!daily&&!orders)u.error=S.daily.length===0;
  set(u);try{localStorage.setItem(LS_META,JSON.stringify({lastUpdated:now}));}catch(e){}
}

// ─── Compute ──────────────────────────────────────────────────────────────────
function inR(iso,s,e){const t=new Date(iso+'T00:00:00').getTime();return t>=s&&t<e;}

function compute(){
  const{orders,daily,loading,error,from,to,activeShortcut,search,adsByMonth,adsDraft,visibleCount,showImport,importText,lastUpdated}=S;

  const s=new Date(from+'T00:00:00').getTime();
  const e=addD(new Date(to+'T00:00:00'),1).getTime();
  const rangeDays=Math.round((e-s)/86400000);

  // Previous period of same length
  const prevE=s;
  const prevS=addD(new Date(from+'T00:00:00'),-rangeDays).getTime();

  // Totals from MARKETING_DIARIO
  const dailyIn=daily.filter(r=>inR(r.fecha,s,e));
  const total=dailyIn.reduce((a,r)=>a+r.val,0);
  const prevTotal=daily.filter(r=>inR(r.fecha,prevS,prevE)).reduce((a,r)=>a+r.val,0);

  // Orders from BASE_VENTAS
  const inP=orders.filter(r=>inR(r.fecha,s,e));
  const valid=inP.filter(r=>r.valida);
  const nOrders=valid.length;
  const pending=inP.length-nOrders;
  const avgTicket=nOrders>0?total/nOrders:0;

  const prodMap={};
  valid.forEach(r=>{const k=r.referencia+(r.tipo?' · '+r.tipo:'');
    if(!prodMap[k])prodMap[k]={ref:r.referencia,tipo:r.tipo,u:0,t:0};
    prodMap[k].u++;prodMap[k].t+=r.total;});
  const topArr=Object.values(prodMap).sort((a,b)=>b.u-a.u);
  const top=topArr[0]||{ref:'—',u:0};

  // Proyección fin de mes basada en promedio diario del rango seleccionado
  const dailyAvg=rangeDays>0?total/rangeDays:0;
  const toDateObj=new Date(to+'T00:00:00');
  const daysInMonth=new Date(toDateObj.getFullYear(),toDateObj.getMonth()+1,0).getDate();
  // Días transcurridos en el mes hasta el "to" del rango
  const monthStartMs=new Date(toDateObj.getFullYear(),toDateObj.getMonth(),1).getTime();
  const toMs=addD(toDateObj,1).getTime();
  const daysElapsedInMonth=Math.round((toMs-monthStartMs)/86400000);
  const daysRemaining=Math.max(0,daysInMonth-daysElapsedInMonth);
  // Ventas acumuladas en el mes (desde inicio del mes hasta fin del rango)
  const monthAccum=daily.filter(r=>inR(r.fecha,monthStartMs,toMs)).reduce((a,r)=>a+r.val,0);
  const proj=monthAccum+dailyAvg*daysRemaining;

  // Ads spend (keyed to month of "from" date)
  const mKey=from.slice(0,7);
  let ads=adsByMonth[mKey]||0;
  const roas=ads>0?(total/ads):null;

  function groupBy(field,lim){
    const map={};valid.forEach(r=>{const k=r[field]||'Otro';map[k]=(map[k]||0)+r.total;});
    const arr=Object.entries(map).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
    const mx=arr.length?arr[0].v:1;
    return arr.slice(0,lim).map(x=>({label:x.l,value:fm(x.v),pct:Math.max(4,Math.round(x.v/mx*100))}));
  }

  // Trend bars (always from MARKETING_DIARIO)
  const bars=[];
  if(rangeDays<=31){
    let d=new Date(from+'T00:00:00');
    while(d.getTime()<e){const k=dk(d);
      const dr=daily.find(r=>r.fecha===k);
      bars.push({v:dr?dr.val:0,l:d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})});
      d=addD(d,1);}
  }else if(rangeDays<=91){
    let cur=sow(new Date(from+'T00:00:00'));
    while(cur.getTime()<e){const ne=addD(cur,7);
      const v=daily.filter(r=>inR(r.fecha,cur.getTime(),ne.getTime())).reduce((a,r)=>a+r.val,0);
      bars.push({v,l:cur.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})});cur=ne;}
  }else if(rangeDays<=730){
    let cur=new Date(new Date(from+'T00:00:00').getFullYear(),new Date(from+'T00:00:00').getMonth(),1);
    while(cur.getTime()<e){const ne=new Date(cur.getFullYear(),cur.getMonth()+1,1);
      const v=daily.filter(r=>inR(r.fecha,cur.getTime(),ne.getTime())).reduce((a,r)=>a+r.val,0);
      bars.push({v,l:cur.toLocaleDateString('es-CO',{month:'short',year:'2-digit'})});cur=ne;}
  }else{
    const yrs=Array.from(new Set(daily.map(r=>r.fecha.slice(0,4)))).sort();
    yrs.forEach(y=>{const ys=new Date(+y,0,1).getTime();const ye=new Date(+y+1,0,1).getTime();
      bars.push({v:daily.filter(r=>inR(r.fecha,ys,ye)).reduce((a,r)=>a+r.val,0),l:y});});
  }
  const mx=Math.max(1,...bars.map(b=>b.v));
  const trendBars=bars.map(b=>({label:b.l,pct:Math.max(2,Math.round(b.v/mx*100)),title:fm(b.v)}));

  // Detail
  const sl=search.trim().toLowerCase();
  let det=sl?valid.filter(r=>r.cliente.toLowerCase().includes(sl)||r.ciudad.toLowerCase().includes(sl)||
    r.referencia.toLowerCase().includes(sl)||r.tipo.toLowerCase().includes(sl)):valid;
  det=det.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const detRows=det.slice(0,visibleCount).map(r=>({
    fecha:fd(r.fecha),cliente:r.cliente,ciudad:r.ciudad,tipo:r.tipo,canal:r.canal,asesor:r.asesor,
    estado:r.estado,total:fm(r.total),tc:/entreg/i.test(r.estado)?'tag-a':'tag-n'}));

  const pct=prevTotal>0?((total-prevTotal)/prevTotal)*100:(total>0?100:0);
  const pctColor=pct>=0?'var(--accent3)':'var(--n3)';

  const rangeLabel=(()=>{
    if(from===to)return fd(from);
    const f=new Date(from+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    const t2=new Date(to+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    return`${f} — ${t2}`;
  })();

  return{loading,error,showImport,importText,search,from,to,activeShortcut,
    statusLabel:loading?'Sincronizando…':(error?'Sin conexión':'En vivo'),
    statusColor:loading?'var(--n4)':(error?'var(--n4)':'var(--accent3)'),
    spin:loading?'display:inline-block;animation:spin 1s linear infinite;':'',
    kpiTotal:fm(total),nOrders,pending,avgTicket:fm(avgTicket),
    top:top.ref,topU:top.u,
    roas:roas?roas.toFixed(2)+'x':'—',roasC:roas&&roas>=3?'var(--accent3)':'var(--text)',
    adsLabel:ads?fm(ads):'sin registrar',
    proj:fm(proj),projAvg:fm(dailyAvg),projDaysLeft:daysRemaining,projMonth:daysInMonth,
    vsPct:(pct>=0?'+':'')+pct.toFixed(1)+'%',pctColor,
    vsLabel:(pct>=0?'↑ ':'↓ ')+Math.abs(pct).toFixed(1)+'% vs. periodo anterior',
    prevLabel:fm(prevTotal),
    adsVal:adsDraft,adsMKey:mKey,
    adsMonthLabel:`Clave mes: ${mKey} · actual: ${adsByMonth[mKey]?fm(adsByMonth[mKey]):'sin registrar'}`,
    trendBars,
    pay:groupBy('metodoPago',5),canal:groupBy('canal',6),ciudad:groupBy('ciudad',6),asesor:groupBy('asesor',6),
    topArr:topArr.slice(0,8),detRows,hasMore:det.length>visibleCount,detCount:det.length,
    rangeLabel,rangeDays,
    lastLabel:lastUpdated?`Actualizado ${new Date(lastUpdated).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`:'Sin sincronizar aún'
  };
}

// ─── Render ───────────────────────────────────────────────────────────────────
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const bRow=arr=>arr.map(p=>`<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
  <span>${esc(p.label)}</span><span style="color:var(--n3);">${esc(p.value)}</span></div>
  <div class="bt" style="height:6px;"><div class="bf" style="width:${p.pct}%;height:6px;"></div></div></div>`).join('');

function render(){
  const v=compute();
  const sc=shortcuts();
  document.getElementById('root').innerHTML=`
<div style="min-height:100vh;display:flex;flex-direction:column;">

  <!-- Nav -->
  <div class="nav" style="justify-content:space-between;padding:var(--s4) var(--s6);flex-wrap:wrap;gap:var(--s3);">
    <div style="display:flex;align-items:center;gap:var(--s3);">
      <i class="ph ph-chart-line-up" style="font-size:22px;color:var(--accent);"></i>
      <div>
        <div style="font-weight:500;font-size:17px;">Lili Valencia · Ventas</div>
        <div style="font-size:12px;color:var(--n3);">Dashboard en vivo · MARKETING_DIARIO</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:${v.statusColor};">
        <span style="width:8px;height:8px;border-radius:50%;background:${v.statusColor};display:inline-block;"></span>
        ${esc(v.statusLabel)}
      </div>
      <button class="btn btn-g" id="btn-import" style="font-size:13px;"><i class="ph ph-clipboard-text"></i> Pegar CSV</button>
      <button class="btn btn-s" id="btn-refresh" style="font-size:13px;">
        <i class="ph ph-arrow-clockwise" style="${v.spin}"></i> Actualizar</button>
    </div>
  </div>

  <!-- Pegar CSV -->
  ${v.showImport?`<div class="card emd" style="margin:0 var(--s6) var(--s4);padding:var(--s4);">
    <div class="ktitle" style="margin-bottom:var(--s2);">Pegar datos de MARKETING_DIARIO (CSV)</div>
    <div style="font-size:13px;color:var(--n3);margin-bottom:var(--s2);">
      Archivo → Descargar → Valores separados por comas (.csv) de la pestaña MARKETING_DIARIO, luego pega aquí.
    </div>
    <textarea class="inp" id="import-text" style="width:100%;height:120px;font-family:monospace;font-size:12px;" placeholder="Fecha,Contactos,Cotizaciones,Ventas...">${esc(v.importText)}</textarea>
    <div style="display:flex;gap:var(--s2);margin-top:var(--s3);">
      <button class="btn btn-p" id="btn-apply">Usar estos datos</button>
      <button class="btn btn-g" id="btn-cancel-import">Cancelar</button>
    </div>
  </div>`:''}

  ${v.error?`<div class="card esm" style="margin:0 var(--s6) var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--accent7);">
    <div style="font-size:13px;color:var(--n2);"><i class="ph ph-warning-circle" style="color:var(--accent3);"></i>
    Sin conexión al Sheet. Mostrando última copia guardada.</div></div>`:''}

  <div style="padding:0 var(--s6) var(--s8);display:flex;flex-direction:column;gap:var(--s6);flex:1;">

    <!-- ── Selector de fechas ── -->
    <div class="card esm" style="display:flex;flex-direction:column;gap:var(--s3);">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);">
        <div style="display:flex;align-items:center;gap:var(--s2);">
          <label style="font-size:12px;color:var(--n4);">Desde</label>
          <input type="date" class="inp" id="date-from" value="${esc(v.from)}" style="width:155px;">
        </div>
        <div style="display:flex;align-items:center;gap:var(--s2);">
          <label style="font-size:12px;color:var(--n4);">Hasta</label>
          <input type="date" class="inp" id="date-to" value="${esc(v.to)}" style="width:155px;">
        </div>
        <div style="font-size:13px;font-weight:500;color:var(--n3);">${esc(v.rangeLabel)}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${sc.map(s=>`<button class="chip${s.label===v.activeShortcut?' on':''}" data-from="${s.from}" data-to="${s.to}" data-label="${esc(s.label)}">${esc(s.label)}</button>`).join('')}
      </div>
    </div>

    <!-- ── KPIs ── -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s4);">
      <div class="card esm"><div class="kicker">Ventas totales</div><div class="ktitle" style="font-size:26px;">${esc(v.kpiTotal)}</div><div class="kmeta" style="color:${v.pctColor};">${esc(v.vsLabel)}</div></div>
      <div class="card esm"><div class="kicker">Pedidos</div><div class="ktitle" style="font-size:26px;">${v.nOrders}</div><div class="kmeta">${v.pending} pendientes</div></div>
      <div class="card esm"><div class="kicker">Ticket promedio</div><div class="ktitle" style="font-size:26px;">${esc(v.avgTicket)}</div><div class="kmeta">por pedido válido</div></div>
      <div class="card esm"><div class="kicker">Producto más vendido</div><div class="ktitle" style="font-size:18px;">${esc(v.top)}</div><div class="kmeta">${v.topU} unidades</div></div>
      <div class="card esm"><div class="kicker">ROAS (Ads)</div><div class="ktitle" style="font-size:26px;color:${v.roasC};">${esc(v.roas)}</div><div class="kmeta">${esc(v.adsLabel)} invertido</div></div>
    </div>

    <!-- ── Comparación y proyección ── -->
    <div class="card esm" style="display:flex;flex-wrap:wrap;gap:var(--s6);justify-content:space-between;">
      <div>
        <div class="kicker">Proyección cierre de mes</div>
        <div class="ktitle" style="font-size:22px;">${esc(v.proj)}</div>
        <div class="kmeta">Prom. diario ${esc(v.projAvg)} · ${v.projDaysLeft} días restantes en el mes</div>
      </div>
      <div>
        <div class="kicker">Vs. mismo periodo anterior</div>
        <div class="ktitle" style="font-size:22px;color:${v.pctColor};">${esc(v.vsPct)}</div>
        <div class="kmeta">Periodo ant.: ${esc(v.prevLabel)}</div>
      </div>
      <div style="min-width:220px;">
        <div class="kicker">Inversión en Ads (mes ${v.adsMKey})</div>
        <div style="display:flex;gap:var(--s2);align-items:center;margin-top:var(--s2);">
          <input class="inp" id="ads-input" type="text" inputmode="numeric" style="width:140px;" placeholder="Ej: 1.500.000" value="${esc(v.adsVal)}">
          <button class="btn btn-p" id="btn-ads" style="font-size:13px;">Guardar</button>
        </div>
        <div class="kmeta" style="margin-top:6px;">${esc(v.adsMonthLabel)}</div>
      </div>
    </div>

    <!-- ── Tendencia ── -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:var(--s4);">
      <div class="card esm">
        <div class="kicker" style="margin-bottom:var(--s3);">Tendencia de ventas</div>
        <div style="display:flex;align-items:flex-end;gap:${v.trendBars.length>25?'2':'5'}px;height:180px;overflow:hidden;">
          ${v.trendBars.map(b=>`<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;">
            <div class="bt" style="width:100%;height:140px;display:flex;align-items:flex-end;">
              <div class="bf" style="width:100%;height:${b.pct}%;" title="${esc(b.title)}"></div>
            </div>
            ${v.trendBars.length<=18?`<div style="font-size:9px;color:var(--n4);white-space:nowrap;max-width:100%;overflow:hidden;">${esc(b.label)}</div>`:''}
          </div>`).join('')}
        </div>
      </div>
      <div class="card esm">
        <div class="kicker" style="margin-bottom:var(--s3);">Métodos de pago</div>
        <div style="display:flex;flex-direction:column;gap:var(--s2);">${bRow(v.pay)}</div>
      </div>
    </div>

    <!-- ── Breakdowns ── -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);">
      <div class="card esm"><div class="kicker" style="margin-bottom:var(--s3);">Ventas por canal</div><div style="display:flex;flex-direction:column;gap:var(--s2);">${bRow(v.canal)}</div></div>
      <div class="card esm"><div class="kicker" style="margin-bottom:var(--s3);">Top ciudades</div><div style="display:flex;flex-direction:column;gap:var(--s2);">${bRow(v.ciudad)}</div></div>
      <div class="card esm"><div class="kicker" style="margin-bottom:var(--s3);">Ventas por asesor</div><div style="display:flex;flex-direction:column;gap:var(--s2);">${bRow(v.asesor)}</div></div>
    </div>

    <!-- ── Top productos ── -->
    <div class="card esm">
      <div class="kicker" style="margin-bottom:var(--s3);">Top referencias / productos</div>
      <div class="sx"><table class="table"><thead><tr><th>Referencia</th><th>Producto</th><th>Unidades</th><th>Ventas</th></tr></thead>
      <tbody>${v.topArr.map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.tipo)}</td><td>${p.u}</td><td>${esc(fm(p.t))}</td></tr>`).join('')}</tbody></table></div>
    </div>

    <!-- ── Detalle pedidos ── -->
    <div class="card esm">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s3);margin-bottom:var(--s3);">
        <div class="kicker">Detalle de pedidos (${v.detCount})</div>
        <input class="inp" id="search" type="text" placeholder="Buscar cliente, ciudad, referencia..." style="width:260px;" value="${esc(v.search)}">
      </div>
      <div class="sx"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Producto</th><th>Canal</th><th>Asesor</th><th>Estado</th><th>Total</th></tr></thead>
      <tbody>${v.detRows.map(d=>`<tr>
        <td>${esc(d.fecha)}</td><td>${esc(d.cliente)}</td><td>${esc(d.ciudad)}</td><td>${esc(d.tipo)}</td>
        <td>${esc(d.canal)}</td><td>${esc(d.asesor)}</td>
        <td><span class="tag ${d.tc}">${esc(d.estado)}</span></td><td>${esc(d.total)}</td>
      </tr>`).join('')}</tbody></table></div>
      ${v.hasMore?`<div style="text-align:center;margin-top:var(--s3);"><button class="btn btn-g" id="btn-more">Ver más</button></div>`:''}
    </div>

    <div style="font-size:11px;color:var(--n5);text-align:center;padding-top:var(--s4);">
      <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank">Google Sheets — KPI'S LILI VALENCIA ONLINE</a> · ${esc(v.lastLabel)}
    </div>
  </div>
</div>`;

  // Events
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  on('btn-refresh','click',()=>fetchLive());
  on('btn-import','click',()=>set(s=>({showImport:!s.showImport,importText:''})));
  on('btn-cancel-import','click',()=>set({showImport:false}));
  on('btn-apply','click',()=>{
    const t=($('import-text')||{}).value||'';if(!t.trim())return;
    const d=parseDaily(parseCsv(t));
    if(d.length){const now=new Date().toISOString();
      set({daily:d,showImport:false,error:false,lastUpdated:now});
      try{localStorage.setItem(LS_DAILY,JSON.stringify(d));localStorage.setItem(LS_META,JSON.stringify({lastUpdated:now}));}catch(e){}}
  });
  on('import-text','input',e=>S.importText=e.target.value);
  on('date-from','change',e=>set({from:e.target.value,activeShortcut:''}));
  on('date-to','change',e=>set({to:e.target.value,activeShortcut:''}));
  on('ads-input','input',e=>S.adsDraft=e.target.value);
  on('btn-ads','click',()=>{
    const key=S.from.slice(0,7);const val=pm(S.adsDraft);
    const next={...S.adsByMonth,[key]:val};set({adsByMonth:next,adsDraft:''});
    try{localStorage.setItem(LS_ADS,JSON.stringify(next));}catch(e){}});
  on('search','input',e=>set({search:e.target.value,visibleCount:12}));
  on('btn-more','click',()=>set(s=>({visibleCount:s.visibleCount+20})));
  document.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>
    set({from:el.dataset.from,to:el.dataset.to,activeShortcut:el.dataset.label})));
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(function init(){
  try{
    const d=localStorage.getItem(LS_DAILY);const o=localStorage.getItem(LS_ROWS);
    const m=localStorage.getItem(LS_META);const a=localStorage.getItem(LS_ADS);
    const lu=m?JSON.parse(m).lastUpdated:null;
    if(d)S={...S,daily:JSON.parse(d),loading:false,lastUpdated:lu};
    if(o)S={...S,orders:JSON.parse(o),loading:!d};
    if(a)S={...S,adsByMonth:JSON.parse(a)};
  }catch(e){}
  render();fetchLive();
})();
</script>
</body>
</html>
