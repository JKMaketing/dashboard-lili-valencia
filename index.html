<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lili Valencia · Ventas</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --color-bg:#0d0d14;--color-surface:#13131e;--color-surface-2:#1a1a28;
  --color-text:#e8e8f0;--color-accent:#7c6af7;--color-accent-300:#a89bf9;--color-accent-700:#4b3dc4;
  --color-neutral-200:#d0d0e0;--color-neutral-300:#9090a8;--color-neutral-400:#686880;
  --color-neutral-500:#505068;--color-neutral-700:#2a2a40;--color-neutral-800:#1e1e30;
  --font-body:'Inter',system-ui,sans-serif;--font-heading:'Inter',system-ui,sans-serif;
  --space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:28px;--space-8:32px;
  --radius-sm:6px;--radius-md:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.5;}
a{color:var(--color-accent-300);}a:hover{color:var(--color-accent);}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--color-neutral-700);border-radius:var(--radius-sm)}
.card{background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-4);}
.elev-sm{box-shadow:0 1px 3px rgba(0,0,0,.4)}.elev-md{box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-neutral-300);margin-bottom:4px}
.card-title{font-weight:600;color:var(--color-text)}.card-meta{font-size:12px;color:var(--color-neutral-300);margin-top:4px}
.card-body{color:var(--color-neutral-300)}
.nav{display:flex;background:var(--color-surface);border-bottom:1px solid var(--color-neutral-800);align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-family:var(--font-body);transition:background .15s}
.btn-primary{background:var(--color-accent);color:#fff}.btn-primary:hover{background:var(--color-accent-700)}
.btn-secondary{background:var(--color-surface-2);color:var(--color-text);border:1px solid var(--color-neutral-700)}.btn-secondary:hover{background:var(--color-neutral-800)}
.btn-ghost{background:transparent;color:var(--color-neutral-300)}.btn-ghost:hover{background:var(--color-surface-2);color:var(--color-text)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);border:none;cursor:pointer;background:transparent;color:var(--color-neutral-300)}.btn-icon:hover{background:var(--color-surface-2)}
.seg{background:var(--color-neutral-800);border-radius:var(--radius-sm);padding:2px;display:inline-flex}
.seg-opt{padding:5px 12px;border-radius:4px;font-size:13px;color:var(--color-neutral-300);cursor:pointer;transition:all .15s}
.seg-opt.active{background:var(--color-surface);color:var(--color-text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.input{background:var(--color-neutral-800);border:1px solid var(--color-neutral-700);border-radius:var(--radius-sm);padding:7px 10px;color:var(--color-text);font-family:var(--font-body);font-size:13px;outline:none}
.input:focus{border-color:var(--color-accent)}
.table{border-collapse:collapse;width:100%}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-neutral-400);padding:8px 12px;border-bottom:1px solid var(--color-neutral-800)}
.table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--color-neutral-800);color:var(--color-text)}
.table tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-accent{background:rgba(124,106,247,.2);color:var(--color-accent-300)}.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-300)}
.bar-track{background:var(--color-neutral-800);border-radius:var(--radius-sm);overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--color-accent-700),var(--color-accent));border-radius:var(--radius-sm)}
.scroll-x{overflow-x:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SHEET_ID='1DQO1nI8ucA8eiEGPKtxCk0PfTBJC3PMWWC8Zu5AWqqk';
const SHEET_TAB='BASE_VENTAS';
const LS_ROWS='lv_dashboard_rows_v1';
const LS_ADS='lv_dashboard_ads_v1';
const LS_META='lv_dashboard_meta_v1';

function parseMoney(s){if(!s)return 0;const c=String(s).replace(/[^0-9]/g,'');return c?parseInt(c,10):0;}
function fmtMoney(n){'';return'$'+new Intl.NumberFormat('es-CO').format(Math.round(n||0));}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}
function dateKey(d){return d.toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function startOfWeek(d){const r=new Date(d);const day=(r.getDay()+6)%7;return addDays(r,-day);}

function parseCsv(text){
  const rows=[];let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}else field+=c;}
    else{if(c==='"')inQuotes=true;else if(c===','){row.push(field);field='';}else if(c==='\r'){}
    else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}else field+=c;}
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(v=>v!==''));
}
function toISODate(row){
  const texto=(row[25]||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(texto))return texto;
  const compra=(row[0]||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(compra))return compra;
  const m=compra.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return null;
}
function rowsToObjects(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||r.length<5)continue;
    const iso=toISODate(r);if(!iso)continue;
    out.push({fecha:iso,cliente:(r[1]||'').trim(),ciudad:(r[2]||'').trim(),talla:(r[5]||'').trim(),
      precioVenta:parseMoney(r[6]),metodoPago:(r[7]||'Otro').trim()||'Otro',canal:(r[8]||'Otro').trim()||'Otro',
      tipo:(r[9]||'Otro').trim()||'Otro',proveedor:(r[10]||'').trim(),referencia:(r[11]||'').trim()||'—',
      color:(r[12]||'').trim(),estado:(r[17]||'').trim()||'Sin estado',asesor:(r[18]||'').trim()||'Sin asesor',
      total:parseMoney(r[19])||parseMoney(r[6]),valida:(r[22]||'').trim()==='1',
      year:parseInt(iso.slice(0,4),10),month:parseInt(iso.slice(5,7),10)});
  }
  return out;
}

// ─── App State ───────────────────────────────────────────────────────────────
let STATE={rows:[],loading:true,error:false,lastUpdated:null,period:'month',anchor:new Date(),
  search:'',showImport:false,importText:'',adsByMonth:{},adsDraft:'',visibleCount:12};

function setState(patch){
  const next=typeof patch==='function'?patch(STATE):patch;
  STATE={...STATE,...next};
  render();
}

// ─── Data fetching ────────────────────────────────────────────────────────────
async function fetchLive(){
  setState({loading:true});
  const urls=[
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`,
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`,
  ];
  for(const url of urls){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok)continue;
      const text=await res.text();
      if(!text||text.trim().length<20)continue;
      const rows=rowsToObjects(parseCsv(text));
      if(rows.length>0){
        const now=new Date().toISOString();
        setState({rows,loading:false,error:false,lastUpdated:now});
        try{localStorage.setItem(LS_ROWS,JSON.stringify(rows));localStorage.setItem(LS_META,JSON.stringify({lastUpdated:now}));}catch(e){}
        return;
      }
    }catch(e){}
  }
  setState(s=>({loading:false,error:s.rows.length===0}));
}

// ─── Range helpers ────────────────────────────────────────────────────────────
function getRange(period,anchor){
  const a=new Date(anchor);a.setHours(0,0,0,0);
  if(period==='day')return{start:a,end:addDays(a,1)};
  if(period==='week'){const s=startOfWeek(a);return{start:s,end:addDays(s,7)};}
  if(period==='month'){return{start:new Date(a.getFullYear(),a.getMonth(),1),end:new Date(a.getFullYear(),a.getMonth()+1,1)};}
  return{start:new Date(a.getFullYear(),0,1),end:new Date(a.getFullYear()+1,0,1)};
}
function inRange(iso,start,end){const t=new Date(iso+'T00:00:00').getTime();return t>=start.getTime()&&t<end.getTime();}

// ─── Computed values ──────────────────────────────────────────────────────────
function compute(){
  const{rows,loading,error,period,anchor,search,adsByMonth,adsDraft,visibleCount,showImport,importText,lastUpdated}=STATE;
  const{start,end}=getRange(period,anchor);
  const prevAnchor=new Date(anchor);
  if(period==='day')prevAnchor.setDate(prevAnchor.getDate()-1);
  else if(period==='week')prevAnchor.setDate(prevAnchor.getDate()-7);
  else if(period==='month')prevAnchor.setMonth(prevAnchor.getMonth()-1);
  else prevAnchor.setFullYear(prevAnchor.getFullYear()-1);
  const prevRange=getRange(period,prevAnchor);

  const inPeriod=rows.filter(r=>inRange(r.fecha,start,end));
  const validInPeriod=inPeriod.filter(r=>r.valida);
  const prevInPeriod=rows.filter(r=>inRange(r.fecha,prevRange.start,prevRange.end)&&r.valida);

  const total=validInPeriod.reduce((s,r)=>s+r.total,0);
  const prevTotal=prevInPeriod.reduce((s,r)=>s+r.total,0);
  const orders=validInPeriod.length;
  const pending=inPeriod.length-orders;
  const avgTicket=orders>0?total/orders:0;

  const productMap={};
  validInPeriod.forEach(r=>{const k=r.referencia+(r.tipo?' · '+r.tipo:'');
    if(!productMap[k])productMap[k]={ref:r.referencia,tipo:r.tipo,units:0,total:0};
    productMap[k].units++;productMap[k].total+=r.total;});
  const topProductsArr=Object.values(productMap).sort((a,b)=>b.units-a.units);
  const topProduct=topProductsArr[0]||{ref:'—',units:0};

  const now=new Date();let elapsedFrac=1;
  if(now>=start&&now<end)elapsedFrac=(now.getTime()-start.getTime())/(end.getTime()-start.getTime());
  else if(now<start)elapsedFrac=0.001;
  const projected=elapsedFrac>0.02?total/elapsedFrac:total;

  const monthKey=`${anchor.getFullYear()}-${String(anchor.getMonth()+1).padStart(2,'0')}`;
  let adsSpend=0;
  if(period==='year'){for(let m=1;m<=12;m++)adsSpend+=adsByMonth[`${anchor.getFullYear()}-${String(m).padStart(2,'0')}`]||0;}
  else{
    adsSpend=adsByMonth[monthKey]||0;
    if(period!=='month'&&adsSpend){const dim=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();
      const dir=Math.round((end-start)/86400000);adsSpend=adsSpend*(dir/dim);}
  }
  const roas=adsSpend>0?(total/adsSpend):null;

  function groupBy(field,limit){
    const map={};
    validInPeriod.forEach(r=>{const k=r[field]||'Otro';map[k]=(map[k]||0)+r.total;});
    const arr=Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
    const max=arr.length?arr[0].value:1;
    return arr.slice(0,limit||arr.length).map(x=>({label:x.label,value:fmtMoney(x.value),pct:Math.max(4,Math.round((x.value/max)*100))}));
  }

  // trend bars
  const trendBars=[];
  if(period==='day'){
    for(let i=13;i>=0;i--){const d=addDays(new Date(anchor),-i);const k=dateKey(d);
      const val=rows.filter(r=>r.fecha===k&&r.valida).reduce((s,r)=>s+r.total,0);
      trendBars.push({val,label:d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})});}
  }else if(period==='week'){
    for(let i=9;i>=0;i--){const s=startOfWeek(addDays(new Date(anchor),-7*i));const e=addDays(s,7);
      const val=rows.filter(r=>inRange(r.fecha,s,e)&&r.valida).reduce((sum,r)=>sum+r.total,0);
      trendBars.push({val,label:s.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})});}
  }else if(period==='month'){
    for(let i=11;i>=0;i--){const d=new Date(anchor.getFullYear(),anchor.getMonth()-i,1);
      const s=new Date(d.getFullYear(),d.getMonth(),1);const e=new Date(d.getFullYear(),d.getMonth()+1,1);
      const val=rows.filter(r=>inRange(r.fecha,s,e)&&r.valida).reduce((sum,r)=>sum+r.total,0);
      trendBars.push({val,label:d.toLocaleDateString('es-CO',{month:'short',year:'2-digit'})});}
  }else{
    const years=Array.from(new Set(rows.map(r=>r.year))).sort();
    const yrs=years.length?years:[anchor.getFullYear()];
    yrs.forEach(y=>{const s=new Date(y,0,1);const e=new Date(y+1,0,1);
      const val=rows.filter(r=>inRange(r.fecha,s,e)&&r.valida).reduce((sum,r)=>sum+r.total,0);
      trendBars.push({val,label:String(y)});});
  }
  const maxTrend=Math.max(1,...trendBars.map(b=>b.val));
  const trendBarsOut=trendBars.map(b=>({label:b.label,pct:Math.max(2,Math.round((b.val/maxTrend)*100)),title:fmtMoney(b.val)}));

  const searchLower=search.trim().toLowerCase();
  let filteredDetail=validInPeriod;
  if(searchLower)filteredDetail=filteredDetail.filter(r=>
    r.cliente.toLowerCase().includes(searchLower)||r.ciudad.toLowerCase().includes(searchLower)||
    r.referencia.toLowerCase().includes(searchLower)||r.tipo.toLowerCase().includes(searchLower));
  filteredDetail=filteredDetail.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const detailRows=filteredDetail.slice(0,visibleCount).map(r=>({
    fecha:fmtDate(r.fecha),cliente:r.cliente,ciudad:r.ciudad,tipo:r.tipo,canal:r.canal,asesor:r.asesor,
    estado:r.estado,total:fmtMoney(r.total),tagClass:/entreg/i.test(r.estado)?'tag-accent':'tag-neutral'}));

  const periodLabels={day:'Día',week:'Semana',month:'Mes',year:'Año'};
  const periods=['day','week','month','year'];
  let periodLabel='';
  if(period==='day')periodLabel=start.toLocaleDateString('es-CO',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  else if(period==='week')periodLabel=`Semana del ${start.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})} al ${addDays(end,-1).toLocaleDateString('es-CO',{day:'2-digit',month:'short'})}`;
  else if(period==='month')periodLabel=start.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  else periodLabel=String(anchor.getFullYear());

  const pctChange=prevTotal>0?((total-prevTotal)/prevTotal)*100:(total>0?100:0);
  const vsPrevColor=pctChange>=0?'var(--color-accent-300)':'var(--color-neutral-300)';

  return{loading,error,showImport,importText,search,
    statusLabel:loading?'Sincronizando…':(error?'Sin conexión — datos locales':'En vivo'),
    statusColor:loading?'var(--color-neutral-400)':(error?'var(--color-neutral-400)':'var(--color-accent-300)'),
    spinStyle:loading?'display:inline-block;animation:spin 1s linear infinite;':'',
    periods,periodLabels,period,periodLabel,periodTypeLabel:periodLabels[period].toLowerCase(),
    kpiTotal:fmtMoney(total),kpiOrders:orders,kpiPending:pending,kpiAvg:fmtMoney(avgTicket),
    kpiTopProduct:topProduct.ref,kpiTopProductCount:topProduct.units,
    kpiRoas:roas!==null?roas.toFixed(2)+'x':'—',roasColor:roas!==null&&roas>=3?'var(--color-accent-300)':'var(--color-text)',
    kpiAdsSpendLabel:adsSpend>0?fmtMoney(adsSpend):'sin registrar',
    projectionValue:fmtMoney(projected),
    vsPrevPct:(pctChange>=0?'+':'')+pctChange.toFixed(1)+'%',vsPrevColor,
    vsPrevLabel:(pctChange>=0?'↑ ':'↓ ')+Math.abs(pctChange).toFixed(1)+'% vs. anterior',
    kpiPrevTotal:fmtMoney(prevTotal),
    adsInputValue:adsDraft,adsMonthLabel:`Mes: ${anchor.toLocaleDateString('es-CO',{month:'long',year:'numeric'})} · actual: ${adsByMonth[monthKey]?fmtMoney(adsByMonth[monthKey]):'sin registrar'}`,
    trendBarsOut,paymentBreakdown:groupBy('metodoPago',5),channelBreakdown:groupBy('canal',6),
    cityBreakdown:groupBy('ciudad',6),advisorBreakdown:groupBy('asesor',6),
    topProductsArr:topProductsArr.slice(0,8),detailRows,hasMore:filteredDetail.length>visibleCount,
    detailCount:filteredDetail.length,
    sheetUrl:`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`,
    lastUpdatedLabel:lastUpdated?`Actualizado ${new Date(lastUpdated).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`:'Sin sincronizar aún'
  };
}

// ─── Render ───────────────────────────────────────────────────────────────────
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function barRows(arr){
  return arr.map(p=>`<div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
      <span>${esc(p.label)}</span><span style="color:var(--color-neutral-300);">${esc(p.value)}</span>
    </div>
    <div class="bar-track" style="height:6px;"><div class="bar-fill" style="width:${p.pct}%;height:6px;"></div></div>
  </div>`).join('');
}

function render(){
  const v=compute();
  const root=document.getElementById('root');
  root.innerHTML=`
<div style="min-height:100vh;display:flex;flex-direction:column;">

  <div class="nav" style="justify-content:space-between;padding:var(--space-4) var(--space-6);flex-wrap:wrap;gap:var(--space-3);">
    <div style="display:flex;align-items:center;gap:var(--space-3);">
      <i class="ph ph-chart-line-up" style="font-size:22px;color:var(--color-accent);"></i>
      <div>
        <div style="font-weight:500;font-size:17px;">Lili Valencia · Ventas</div>
        <div style="font-size:12px;color:var(--color-neutral-300);">Dashboard en vivo desde Google Sheets</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:${v.statusColor};">
        <span style="width:8px;height:8px;border-radius:50%;background:${v.statusColor};display:inline-block;"></span>
        ${esc(v.statusLabel)}
      </div>
      <button class="btn btn-ghost" id="btn-import" style="font-size:13px;"><i class="ph ph-clipboard-text"></i> Pegar CSV</button>
      <button class="btn btn-secondary" id="btn-refresh" style="font-size:13px;">
        <i class="ph ph-arrow-clockwise" style="${v.spinStyle}"></i> Actualizar
      </button>
    </div>
  </div>

  ${v.showImport?`<div class="card elev-md" style="margin:0 var(--space-6) var(--space-4);padding:var(--space-4);">
    <div class="card-title" style="margin-bottom:var(--space-2);">Pegar datos actualizados (CSV exportado de tu hoja)</div>
    <div class="card-body" style="font-size:13px;color:var(--color-neutral-300);margin-bottom:var(--space-2);">
      En Google Sheets: Archivo → Descargar → Valores separados por comas (.csv) de la pestaña BASE_VENTAS, abre el archivo y pega todo aquí.
    </div>
    <textarea class="input" id="import-text" style="width:100%;height:120px;font-family:monospace;font-size:12px;" placeholder="Fecha compra,Cliente,Ciudad,...">${esc(v.importText)}</textarea>
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);">
      <button class="btn btn-primary" id="btn-apply-import">Usar estos datos</button>
      <button class="btn btn-ghost" id="btn-cancel-import">Cancelar</button>
    </div>
  </div>`:''}

  ${v.error?`<div class="card elev-sm" style="margin:0 var(--space-6) var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--color-accent-700);">
    <div style="font-size:13px;color:var(--color-neutral-200);">
      <i class="ph ph-warning-circle" style="color:var(--color-accent-300);"></i>
      No se pudo conectar en vivo con el Sheet. Mostrando la última copia guardada — usa "Pegar CSV" para actualizar manualmente.
    </div>
  </div>`:''}

  <div style="padding:0 var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-6);flex:1;">

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);">
      <div class="seg" style="display:inline-flex;">
        ${v.periods.map(p=>`<div class="seg-opt ${p===v.period?'active':''}" data-period="${p}" style="cursor:pointer;">${v.periodLabels[p]}</div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:var(--space-2);">
        <button class="btn-icon btn-ghost" id="btn-prev"><i class="ph ph-caret-left"></i></button>
        <div style="font-size:14px;min-width:180px;text-align:center;font-weight:500;">${esc(v.periodLabel)}</div>
        <button class="btn-icon btn-ghost" id="btn-next"><i class="ph ph-caret-right"></i></button>
        <button class="btn btn-ghost" id="btn-today" style="font-size:12px;">Hoy</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4);">
      <div class="card elev-sm"><div class="card-kicker">Ventas totales</div><div class="card-title" style="font-size:26px;">${esc(v.kpiTotal)}</div><div class="card-meta" style="color:${v.vsPrevColor};">${esc(v.vsPrevLabel)}</div></div>
      <div class="card elev-sm"><div class="card-kicker">Pedidos</div><div class="card-title" style="font-size:26px;">${v.kpiOrders}</div><div class="card-meta">${v.kpiPending} pendientes</div></div>
      <div class="card elev-sm"><div class="card-kicker">Ticket promedio</div><div class="card-title" style="font-size:26px;">${esc(v.kpiAvg)}</div><div class="card-meta">por pedido válido</div></div>
      <div class="card elev-sm"><div class="card-kicker">Producto más vendido</div><div class="card-title" style="font-size:18px;">${esc(v.kpiTopProduct)}</div><div class="card-meta">${v.kpiTopProductCount} unidades</div></div>
      <div class="card elev-sm"><div class="card-kicker">ROAS (Ads)</div><div class="card-title" style="font-size:26px;color:${v.roasColor};">${esc(v.kpiRoas)}</div><div class="card-meta">${esc(v.kpiAdsSpendLabel)} invertido</div></div>
    </div>

    <div class="card elev-sm" style="display:flex;flex-wrap:wrap;gap:var(--space-6);justify-content:space-between;">
      <div>
        <div class="card-kicker">Proyección de cierre (${esc(v.periodTypeLabel)})</div>
        <div class="card-title" style="font-size:22px;">${esc(v.projectionValue)}</div>
        <div class="card-meta">Al ritmo actual de venta</div>
      </div>
      <div>
        <div class="card-kicker">Vs. periodo anterior</div>
        <div class="card-title" style="font-size:22px;color:${v.vsPrevColor};">${esc(v.vsPrevPct)}</div>
        <div class="card-meta">Periodo anterior: ${esc(v.kpiPrevTotal)}</div>
      </div>
      <div style="min-width:220px;">
        <div class="card-kicker">Inversión en Ads este mes</div>
        <div style="display:flex;gap:var(--space-2);align-items:center;margin-top:var(--space-2);">
          <input class="input" id="ads-input" type="text" inputmode="numeric" style="width:140px;" placeholder="Ej: 1.500.000" value="${esc(v.adsInputValue)}">
          <button class="btn btn-primary" id="btn-save-ads" style="font-size:13px;">Guardar</button>
        </div>
        <div class="card-meta" style="margin-top:6px;">${esc(v.adsMonthLabel)}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:var(--space-4);">
      <div class="card elev-sm">
        <div class="card-kicker" style="margin-bottom:var(--space-3);">Tendencia de ventas</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:180px;">
          ${v.trendBarsOut.map(b=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
            <div class="bar-track" style="width:100%;height:140px;display:flex;align-items:flex-end;">
              <div class="bar-fill" style="width:100%;height:${b.pct}%;" title="${esc(b.title)}"></div>
            </div>
            <div style="font-size:10px;color:var(--color-neutral-400);white-space:nowrap;">${esc(b.label)}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="card elev-sm">
        <div class="card-kicker" style="margin-bottom:var(--space-3);">Métodos de pago</div>
        <div style="display:flex;flex-direction:column;gap:var(--space-2);">${barRows(v.paymentBreakdown)}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);">
      <div class="card elev-sm"><div class="card-kicker" style="margin-bottom:var(--space-3);">Ventas por canal</div><div style="display:flex;flex-direction:column;gap:var(--space-2);">${barRows(v.channelBreakdown)}</div></div>
      <div class="card elev-sm"><div class="card-kicker" style="margin-bottom:var(--space-3);">Top ciudades</div><div style="display:flex;flex-direction:column;gap:var(--space-2);">${barRows(v.cityBreakdown)}</div></div>
      <div class="card elev-sm"><div class="card-kicker" style="margin-bottom:var(--space-3);">Ventas por asesor</div><div style="display:flex;flex-direction:column;gap:var(--space-2);">${barRows(v.advisorBreakdown)}</div></div>
    </div>

    <div class="card elev-sm">
      <div class="card-kicker" style="margin-bottom:var(--space-3);">Top referencias / productos</div>
      <div class="scroll-x">
        <table class="table"><thead><tr><th>Referencia</th><th>Producto</th><th>Unidades</th><th>Ventas</th></tr></thead>
        <tbody>${v.topProductsArr.map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.tipo)}</td><td>${p.units}</td><td>${esc(fmtMoney(p.total))}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>

    <div class="card elev-sm">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-3);">
        <div class="card-kicker">Detalle de pedidos (${v.detailCount})</div>
        <input class="input" id="search-input" type="text" placeholder="Buscar cliente, ciudad, referencia..." style="width:260px;" value="${esc(v.search)}">
      </div>
      <div class="scroll-x">
        <table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Producto</th><th>Canal</th><th>Asesor</th><th>Estado</th><th>Total</th></tr></thead>
        <tbody>${v.detailRows.map(d=>`<tr>
          <td>${esc(d.fecha)}</td><td>${esc(d.cliente)}</td><td>${esc(d.ciudad)}</td><td>${esc(d.tipo)}</td>
          <td>${esc(d.canal)}</td><td>${esc(d.asesor)}</td>
          <td><span class="tag ${d.tagClass}">${esc(d.estado)}</span></td><td>${esc(d.total)}</td>
        </tr>`).join('')}</tbody></table>
      </div>
      ${v.hasMore?`<div style="text-align:center;margin-top:var(--space-3);"><button class="btn btn-ghost" id="btn-more">Ver más</button></div>`:''}
    </div>

    <div style="font-size:11px;color:var(--color-neutral-500);text-align:center;padding-top:var(--space-4);">
      Fuente: <a href="${esc(v.sheetUrl)}" target="_blank">Google Sheets — KPI'S LILI VALENCIA ONLINE</a> · ${esc(v.lastUpdatedLabel)}
    </div>
  </div>
</div>`;

  // Attach events
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  on('btn-refresh','click',()=>fetchLive());
  on('btn-import','click',()=>setState(s=>({showImport:!s.showImport,importText:''})));
  on('btn-cancel-import','click',()=>setState({showImport:false,importText:''}));
  on('btn-apply-import','click',()=>{
    const text=($('import-text')||{}).value||'';
    if(!text.trim())return;
    const rows=rowsToObjects(parseCsv(text));
    if(rows.length>0){const now=new Date().toISOString();
      setState({rows,showImport:false,importText:'',error:false,lastUpdated:now});
      try{localStorage.setItem(LS_ROWS,JSON.stringify(rows));localStorage.setItem(LS_META,JSON.stringify({lastUpdated:now}));}catch(e){}}
  });
  on('import-text','input',e=>STATE.importText=e.target.value);
  on('btn-prev','click',()=>{const a=new Date(STATE.anchor);const p=STATE.period;
    if(p==='day')a.setDate(a.getDate()-1);else if(p==='week')a.setDate(a.getDate()-7);
    else if(p==='month')a.setMonth(a.getMonth()-1);else a.setFullYear(a.getFullYear()-1);
    setState({anchor:a});});
  on('btn-next','click',()=>{const a=new Date(STATE.anchor);const p=STATE.period;
    if(p==='day')a.setDate(a.getDate()+1);else if(p==='week')a.setDate(a.getDate()+7);
    else if(p==='month')a.setMonth(a.getMonth()+1);else a.setFullYear(a.getFullYear()+1);
    setState({anchor:a});});
  on('btn-today','click',()=>setState({anchor:new Date()}));
  on('btn-save-ads','click',()=>{
    const key=`${STATE.anchor.getFullYear()}-${String(STATE.anchor.getMonth()+1).padStart(2,'0')}`;
    const val=parseMoney(STATE.adsDraft);
    const next={...STATE.adsByMonth,[key]:val};
    setState({adsByMonth:next,adsDraft:''});
    try{localStorage.setItem(LS_ADS,JSON.stringify(next));}catch(e){}
  });
  on('ads-input','input',e=>STATE.adsDraft=e.target.value);
  on('search-input','input',e=>setState({search:e.target.value,visibleCount:12}));
  on('btn-more','click',()=>setState(s=>({visibleCount:s.visibleCount+20})));
  document.querySelectorAll('[data-period]').forEach(el=>el.addEventListener('click',()=>setState({period:el.dataset.period,visibleCount:12})));
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(function init(){
  try{const cached=localStorage.getItem(LS_ROWS);const meta=localStorage.getItem(LS_META);
    if(cached)STATE={...STATE,rows:JSON.parse(cached),loading:false,lastUpdated:meta?JSON.parse(meta).lastUpdated:null};
    const ads=localStorage.getItem(LS_ADS);if(ads)STATE={...STATE,adsByMonth:JSON.parse(ads)};}catch(e){}
  render();
  fetchLive();
})();
</script>
</body>
</html>
